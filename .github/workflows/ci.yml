name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 在 24.x 上完整验证过；macOS 才能跑原生自检（swiftc 来自 Xcode）
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 零依赖校验
        run: |
          test ! -d node_modules
          node -e "const p=require('./package.json'); const deps=Object.keys(p.dependencies||{}).concat(Object.keys(p.devDependencies||{})); if (deps.length) { console.error('出现了第三方依赖: '+deps.join(',')); process.exit(1); } console.log('零依赖校验通过');"
      - name: 全仓语法体检
        run: bash scripts/check-syntax.sh
      - name: 静态守卫（缺导入 / 体量 / 契约 / 能力对照 / 一致性）
        run: |
          node scripts/lint-unresolved.mjs
          node --test test/size-budget.test.mjs test/api-contract.test.mjs test/capability-matrix.test.mjs test/consistency.test.mjs
      - name: 用例
        run: node --test
      - name: 题库体检与白名单对账
        run: |
          node src/cli.mjs audit
          node src/cli.mjs security whitelist
      - name: CLI 冒烟
        env:
          DSH_LEARN_HOME: ${{ runner.temp }}/dsh-learn
        run: |
          node src/cli.mjs list --track=docker --level=easy
          node src/cli.mjs check docker.run-web "docker run -d -p 8080:80 --name web nginx:1.25" --client ci-box
          node src/cli.mjs progress
      - name: 浏览器层 e2e（无 Chrome 时自动跳过）
        run: node scripts/e2e-web.mjs
      - name: 完整验收（仅 macOS：含原生客户端自检）
        if: runner.os == 'macOS'
        env:
          DSH_LEARN_HOME: ${{ runner.temp }}/dsh-learn-verify
        run: bash scripts/verify.sh
